{% extends "layout.html" %}

{% block title %}
    Register
{% endblock %}

{% block main %}
    <form action="/register" method="post">
      <h1>Welcome to Battles</h1>
      <div class="mb-3">
        <input autocomplete="off" autofocus class="form-control mx-auto w-auto" id="username" name="username" placeholder="Username" type="text">
      </div>
      <div class="mb-3">
        <input class="form-control mx-auto w-auto" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" title="Please enter an email" id="email" name="email" placeholder="Email" type="text">
      </div>
      <div class="mb-3">
          <input class="form-control mx-auto w-auto" title="Must contain at least one  number and one uppercase and lowercase letter, and at least 8 or more characters" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" id="password" name="password" placeholder="Password" type="password">
      </div>
      <div class="mb-3">
        <input class="form-control mx-auto w-auto"  title="Must contain at least one  number and one uppercase and lowercase letter, and at least 8 or more characters" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" id="confirmation" name="confirmation" placeholder="Confirm Password" type="password">
      </div>
        <button class="btn btn-primary" type="submit">Register</button>
    </form>
{% endblock %}
